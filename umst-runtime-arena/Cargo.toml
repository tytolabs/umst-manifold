[package]
name = "umst-runtime-arena"
version = "0.1.0"
edition = "2021"
description = "UMST runtime arena — warm-boundary parse of versioned arena bytes (optional mmap feature)"
license = "MIT"
rust-version = "1.75"

[dependencies]
thiserror = "1.0"
memmap2 = { version = "0.9", optional = true }

[features]
default = []
mmap = ["dep:memmap2"]

[dev-dependencies]
tempfile = "3"

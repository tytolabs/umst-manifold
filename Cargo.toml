[workspace]
members = [".", "umst-math", "umst-runtime-arena"]
resolver = "2"

# Striatus dev loop: keep test code debuggable; compile Burn/ndarray deps at full speed.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "umst-manifold"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
build = "build.rs"
authors = [
    "Santhosh Shyamsundar <santhoshshyamsundar@gmail.com>",
    "Santosh Prabhu Shenbagamoorthy",
    "Studio TYTO",
]
description = "A differentiable spatiotemporal manifold for thermodynamic material evolution, built in pure Rust on the burn tensor framework."
documentation = "https://docs.rs/umst-manifold"
homepage = "https://github.com/tytolabs/umst-manifold"
repository = "https://github.com/tytolabs/umst-manifold"
license = "MIT"
readme = "README.md"
keywords = ["physics", "differentiable", "thermodynamics", "topology", "burn"]
categories = ["science", "mathematics", "simulation"]
autobins = false

[features]
default = ["ndarray"]
# CPU backend — always builds in CI without system libraries.
ndarray = []
# macOS: link Apple Accelerate (vecLib) for BLAS-heavy matmul; forward-only to burn-ndarray.
# Use the `mac-fast` umbrella (below) for local Mac development; keep `default` portable for Linux CI.
blas-accelerate = ["burn-ndarray/blas-accelerate"]
# macOS convenience bundle: `ndarray` + Accelerate. Use as
# `cargo test --features mac-fast` or `cargo build --features mac-fast`.
mac-fast = ["ndarray", "blas-accelerate"]
# Optional GPU backend via WGPU (Metal on macOS, Vulkan on Linux).
wgpu = ["burn/wgpu"]
# Optimiser / training utilities.
train = ["burn/train"]
photonics = []
photonics-fdfd = ["photonics"]
photonics-scaffold = ["photonics-fdfd"]
fracture-at2 = []
acoustics-newmark = []
topology-density-evolution = []
thmc-coupled = ["fracture-at2"]
electrochemistry-mvp = []
electrochemistry-pnp = ["electrochemistry-mvp"]
mechanics-voigt-cauchy = []
mechanics-adjoint = ["mechanics-voigt-cauchy"]
mechanics-adjoint-q1-hex = ["topology-density-evolution"]
rheology-bingham = []
rheology_poisson_richardson_fallback = []
statistical-mechanics-vinet = []
statistical-mechanics-johnson-reference = []
solver-stable = ["topology-density-evolution", "statistical-mechanics-vinet"]
solver-research = [
    "fracture-at2",
    "acoustics-newmark",
    "thmc-coupled",
    "electrochemistry-pnp",
    "mechanics-adjoint",
    "mechanics-adjoint-q1-hex",
    "rheology-bingham",
    "photonics-fdfd",
    "statistical-mechanics-johnson-reference",
]
solver-experimental = ["solver-stable", "solver-research"]
information_density = []
solver-tests = ["solver-experimental"]
# Optional structured formal witness wiring (`catalog_schema_digest` on UMST + gateway).
formal-witness = []
# Compiles ROS 2 serde contract module [`ros`].
ros2-contract = []
# Compiles [`src/bin/gate_server.rs`] (+ opt-in gate HTTP integration tests). Alias: `gate-server`.
gate-server-bin = []
gate-server = ["gate-server-bin"]
gate-full = ["gate-server-bin"]
# Enables `serde` derives on gated wire types in [`ros::contract`].
serde = []
# G.3 stub: `ros/trace_calibration` — η bound from `EmittedStepRecord` vs catalog `stepMI ≤ ln 2`.
trace-calibration = ["ros2-contract"]
# Downstream ergonomics hooks (declare + forward to consumers like `umst-concrete-cartridge`).
manifest-bridge = []
manifold-manifest = []
manifold-gate = []
# Experimental: real AdjointNeuralODE mutation, histogram MI, uncertainty channel (default off).
epistemic-ppo = ["train"]
# Landauer / CODATA via `umst-math` (enabled from egoff `manifold-integration`).
math-constants = ["dep:umst-math", "dep:ordered-float"]

[dependencies]
burn = { version = "0.13.0", default-features = false }
burn-ndarray = "0.13.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
bincode = "=2.0.0-rc.3"
# I-0 egoff coupling: align with zeroclaw/matrix-sdk `time ^0.3.44` (was `=0.3.40`).
time = "0.3.47"
rand = "0.8"
num-traits = "0.2"
sha2 = "0.10"
# SSOT: workspace member `umst-math/` (moved from egoff; W3).
umst-math = { path = "umst-math", optional = true }
ordered-float = { version = "5.1", optional = true }

[build-dependencies]
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
approx = "0.5"
num-complex = "0.4"
serde_json = "1.0"
burn = { version = "0.13.0", default-features = false, features = ["std", "train", "autodiff"] }
burn-ndarray = "0.13.0"

[lib]
name = "umst_manifold"
path = "src/lib.rs"

[[example]]
name = "basic_topology"
path = "examples/basic_topology.rs"


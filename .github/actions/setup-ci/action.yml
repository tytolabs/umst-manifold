# SPDX-License-Identifier: MIT
# After `actions/checkout@v4` on umst-manifold: egoff umst-math sibling, Rust 1.88, cache.
name: Setup UMST manifold CI
description: Sparse-checkout egoff umst-math, Rust 1.88, Swatinem cache
inputs:
  components:
    description: Optional rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Checkout egoff (umst-math path dependency)
      uses: actions/checkout@v4
      with:
        repository: tytolabs/egoff
        path: ../egoff
        sparse-checkout: umst-math
        sparse-checkout-cone-mode: false

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88"
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2

# SPDX-License-Identifier: MIT
# After `actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1`: Rust 1.88 + cache (umst-math is workspace member at umst-math/).
name: Setup UMST manifold CI
description: Rust 1.88 toolchain and Swatinem cache
inputs:
  components:
    description: Optional rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: "1.88"
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

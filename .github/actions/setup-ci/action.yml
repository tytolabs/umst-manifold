# SPDX-License-Identifier: MIT
# After `actions/checkout@v4` on umst-manifold: egoff umst-math, Rust 1.88, cache.
name: Setup UMST manifold CI
description: Clone private egoff umst-math, Rust 1.88, Swatinem cache
inputs:
  egoff-read-token:
    description: Token with read access to tytolabs/egoff (use secrets.EGOFF_READ_TOKEN)
    required: true
  components:
    description: Optional rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Clone egoff (umst-math path dependency)
      shell: bash
      env:
        TOKEN: ${{ inputs.egoff-read-token }}
      run: |
        set -euo pipefail
        if [ -f egoff/umst-math/Cargo.toml ]; then
          echo "egoff/umst-math already present"
          exit 0
        fi
        rm -rf egoff
        git clone --depth 1 --filter=blob:none --sparse \
          "https://x-access-token:${TOKEN}@github.com/tytolabs/egoff.git" egoff
        cd egoff
        git sparse-checkout set umst-math

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: "1.88"
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@v2

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  readme-sanity:
    name: README sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README sanity (catch accidental wipes)
        run: |
          set -euo pipefail
          lines=$(wc -l < README.md)
          if [ "$lines" -lt 20 ]; then
            echo "FAIL: README.md is suspiciously short ($lines lines)"
            exit 1
          fi
          echo "OK: README.md has $lines lines"

  # Track K: lint Solver-Status.md (stable rows + optional path existence).
  solver-status:
    name: solver status (docs/Solver-Status.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_solver_status.py (paths + memos + statmech set)
        run: |
          set -euo pipefail
          python3 scripts/check_solver_status.py \
            --check-paths \
            --check-memo-links \
            --check-statmech-verification-set

  # Required job: build the library + run tests on the CPU backend.
  # Stays green on a vanilla GitHub runner without GPU/system libraries.
  build-test:
    name: build & test (ndarray backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Run tests
        run: cargo test --verbose

  # PR gate: solver-stable lane per Cargo.toml (topology-density-evolution + statistical-mechanics-vinet; mechanics/fracture/Johnson live under solver-research).
  solver-stable-pr:
    name: solver-stable tests (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --features solver-stable
        run: cargo test --verbose --features solver-stable

  # PR gate (v0.4 Track K): compile full union without running research-only benchmarks here.
  solver-research-check-pr:
    name: cargo check solver-stable,solver-research (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --features solver-stable,solver-research
        run: cargo check --verbose --all-targets --features solver-stable,solver-research

  # v0.4 Phase-4a: dedicated solver-research verification crates (brief gate 4 lane; see docs/Solver-Status.md).
  phase4-verification-pr:
    name: Phase-4 verification tests (--release, PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release (THMC / photonics DEC brick / statmech Johnson upscale)
        run: |
          set -euo pipefail
          cargo test --verbose --release --features solver-research --test thmc_monolithic_newton_chain
          cargo test --verbose --release --features solver-research,photonics-fdfd --test photonics_curl_curl_2d_patch
          cargo test --verbose --release --features solver-research,photonics-fdfd --test photonics_curl_curl_3d_brick
          cargo test --verbose --release --features solver-research --test statmech_lj_johnson_upscale_bridge

  # Optional PR signal: Phase A physics guard + full solver-experimental test matrix (see docs/CI_GAP_NOTES.md).
  # continue-on-error: not a merge gate; branch protection should keep requiring build-test / lint / solver-* only.
  solver-experimental-pr-optional:
    name: solver-experimental + physics guard (PR, optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: physics Host-tensor guard
        run: bash scripts/check_physics_no_gradient_break.sh
      - name: cargo test --features solver-experimental --no-fail-fast (optional)
        run: cargo test --verbose --features solver-experimental --no-fail-fast

  # v0.4 brief Track K: full experimental stack on default branch (same feature union as PR check), release tests.
  research-stack:
    name: solver-experimental tests (main, release)
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --release --features solver-experimental (retry ×1)
        run: |
          set -euo pipefail
          if ! cargo test --verbose --release --features solver-experimental; then
            echo "retry once after possible flake..."
            cargo test --verbose --release --features solver-experimental
          fi

  # PR / push gate: rustfmt + clippy on the full solver-experimental graph (v0.4 acceptance; matches meta `solver-tests`).
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to rust-toolchain.toml so rustfmt/clippy install on the same toolchain cargo uses.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --features solver-experimental -- -D warnings

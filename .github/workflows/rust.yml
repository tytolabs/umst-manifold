name: Rust CI

on:
  push:
    branches: [main, integ/sprint-1]
  pull_request:

jobs:
  test-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Default features
        run: cargo test --quiet

  feature-gated-physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Feature-gated physics connectivity
        run: cargo test --features thmc-coupled,epistemic-ppo,kleisli-ppo-hot-bind --quiet

  experimental-features:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Experimental fracture-at2
        run: cargo test --features fracture-at2 --quiet
      - name: Experimental photonics
        run: cargo test --features photonics --quiet

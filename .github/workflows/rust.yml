name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required job: build the library + run tests on the CPU backend.
  # Stays green on a vanilla GitHub runner without GPU/system libraries.
  build-test:
    name: build & test (ndarray backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Run tests
        run: cargo test --verbose

  # Advisory jobs: report quality issues but do not block the merge.
  lint:
    name: clippy + rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

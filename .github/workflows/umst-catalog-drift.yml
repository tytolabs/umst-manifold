#
# Catalog drift + gate test suite when this directory is the Git repository root.
# In multi-repo workspace monorepo, use root `.github/workflows/umst-catalog-drift.yml` instead.

name: UMST catalog drift

on:
  push:
    branches: [main, master, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "artifacts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/**"
      - ".umst-pins.toml"
      - ".github/workflows/umst-catalog-drift.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "artifacts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/**"
      - ".umst-pins.toml"
      - ".github/workflows/umst-catalog-drift.yml"
  schedule:
    # Weekly re-proof when manifold is idle but double-slit may have drifted.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  UMST_FORMAL_ROOT: ${{ github.workspace }}/umst-formal-double-slit
  UMST_FORMAL_CLASSICAL_ROOT: ${{ github.workspace }}/umst-formal
  UMST_REQUIRE_FORMAL_EXPORT: "1"

permissions:
  contents: read
  packages: read

jobs:
  verify-umst-stack:
    name: verify UMST stack (export + gate tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-ci

      - name: Read pinned upstream refs
        id: upstream
        run: |
          set -euo pipefail
          ds=$(python3 -c "import tomllib; print(tomllib.load(open('.umst-pins.toml','rb'))['umst-formal-double-slit']['sha'])")
          fm=$(python3 -c "import tomllib; print(tomllib.load(open('.umst-pins.toml','rb'))['umst-formal']['sha'])")
          echo "double_slit_sha=$ds" >> "$GITHUB_OUTPUT"
          echo "formal_sha=$fm" >> "$GITHUB_OUTPUT"

      - name: Checkout umst-formal-double-slit (catalog export)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tytolabs/umst-formal-double-slit
          ref: ${{ steps.upstream.outputs.double_slit_sha }}
          path: umst-formal-double-slit

      - name: Checkout umst-formal (classical fiber)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tytolabs/umst-formal
          ref: ${{ steps.upstream.outputs.formal_sha }}
          path: umst-formal

      - name: Tier 0 doc link SSOT
        run: bash scripts/check_doc_links_tier0.sh

      - name: verify_umst_stack.sh
        run: bash scripts/verify_umst_stack.sh

      - name: bidirectional_catalog_check.sh
        run: bash scripts/bidirectional_catalog_check.sh

      - name: Digest pin cross-check (loud on mismatch)
        run: |
          set -euo pipefail
          want=$(python3 -c "import json; print(json.load(open('artifacts/catalog.lock.json'))['upstream_catalog_digest_hex'])")
          got=$(python3 -c "import json; print(json.load(open('umst-formal-double-slit/artifacts/catalog.lock.json'))['catalog_digest_hex'])")
          if [ "$want" != "$got" ]; then
            echo "::error::Catalog digest mismatch"
            echo "  manifold lock upstream_catalog_digest_hex: $want"
            echo "  double-slit catalog.lock catalog_digest_hex: $got"
            echo "Update protocol: docs/CATALOG_UPDATE_PROTOCOL.md"
            exit 1
          fi
          echo "OK: digest pin matches ($want)"

      - name: Composed catalog digest guard (non-preview fibers)
        run: python3 scripts/catalog_lock_verify.py --composed-digest-guard artifacts/catalog.lock.json

      - name: Primary fiber digest coupling
        run: python3 scripts/catalog_lock_verify.py --coupling-only artifacts/catalog.lock.json

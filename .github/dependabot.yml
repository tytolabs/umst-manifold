version: 2
updates:
  # W-63: no `cargo` ecosystem entry. Cargo.toml depends by path on ../umst-foundations,
  # ../umst-cartridge-api and ../umst-cartridges, which are private; Dependabot fetches only this
  # repository and aborts with path_dependencies_not_reachable before resolving any update. Cargo
  # updates run by hand on a build-capable checkout (docs/DEPENDABOT_TRIAGE.md) until the W-63
  # public ladder makes those siblings public; restore the entry and its ignore list then.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["ci"]
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]

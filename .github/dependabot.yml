version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    # Collapse non-major cargo updates into a single PR to cut review noise (O6 triage).
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # `umst-math` is a workspace path member (not a crates.io crate).
      - dependency-name: "umst-math"
      # sha2 0.11: Digest::finalize() returns hybrid-array; breaks catalog build_script hex formatting (see docs/DEPENDABOT_TRIAGE.md).
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major"]
      - dependency-name: "petgraph"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "burn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "burn-ndarray"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "thiserror"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sha3"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["ci"]
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]

# Allow known crate features for `unexpected_cfgs` / check-cfg (nightly and future stable).
# Feature names match `[features]` in Cargo.toml.
[build]
rustflags = [
    '--check-cfg=cfg(feature,values("acoustics-newmark","electrochemistry-mvp","electrochemistry-pnp","fracture-at2","information_density","mechanics-adjoint","mechanics-voigt-cauchy","photonics","photonics-fdfd","photonics-scaffold","rheology-bingham","solver-experimental","solver-research","solver-stable","solver-tests","statistical-mechanics-johnson-reference","statistical-mechanics-vinet","thmc-coupled","topology-density-evolution"))',
]

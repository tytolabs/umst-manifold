# Allow known crate features for `unexpected_cfgs` / check-cfg (nightly and future stable).
# Feature names match `[features]` in Cargo.toml.
[build]
rustflags = [
    '--check-cfg=cfg(feature,values("acoustics-newmark","electrochemistry-mvp","electrochemistry-pnp","fracture-at2","information_density","mechanics-adjoint","mechanics-voigt-cauchy","photonics","photonics-fdfd","photonics-scaffold","rheology-bingham","rheology_poisson_richardson_fallback","solver-experimental","solver-research","solver-stable","solver-tests","statistical-mechanics-johnson-reference","statistical-mechanics-vinet","thmc-coupled","topology-density-evolution","mac-fast","blas-accelerate"))',
]

# macOS convenience aliases. Use `cargo mt test ...` / `cargo mt run ...` to get Accelerate-backed
# multithreaded BLAS automatically on M-series silicon. Equivalent to passing `--features mac-fast`.
[alias]
mt        = "--features mac-fast"
mt-test   = "test --features mac-fast"
mt-build  = "build --features mac-fast --release"
mt-check  = "check --features mac-fast"
